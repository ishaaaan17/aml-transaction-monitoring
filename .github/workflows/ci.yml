name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The unit tests are deliberately torch-free and dataset-free: they
      # cover the split logic, feature leakage, rules baseline and report
      # generation. The full GPU training pipeline is not run in CI.
      - name: Install test dependencies
        run: pip install pandas numpy scikit-learn matplotlib pytest
      - name: Run tests
        run: pytest tests/ -v
      - name: Byte-compile all sources
        run: python -m compileall -q src/
